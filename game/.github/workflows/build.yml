name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  GODOT_BASE: https://github.com/godotengine/godot/releases/download/4.3-stable
  ANDROID_PLATFORM: "android-34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages (free, official)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;${ANDROID_PLATFORM}" "cmdline-tools;latest"

      - name: Download Godot and export templates
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cd "$HOME/godot"
          curl -fsSL -o godot.zip "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -sf "$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot || sudo ln -sf "$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          unzip -q -j templates.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/android_source.zip" "templates/version.txt" \
            -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          ls -la "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Create throw-away debug keystore and Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot" build
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.3.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Import project (builds class cache and resources)
        run: |
          godot --headless --import || true
          godot --headless --import

      - name: Run automated tests
        run: |
          godot --headless --fixed-fps 60 res://tests/UITest.tscn
          godot --headless --fixed-fps 60 res://tests/WorldTest.tscn

      - name: Validate resources (pack export)
        run: |
          godot --headless --export-pack "Android Debug" build/validate.pck
          test -s build/validate.pck
          rm build/validate.pck

      - name: Export debug APK
        run: |
          godot --headless --export-debug "Android Debug" build/NeonBus-debug.apk
          ls -la build/

      - name: Verify APK
        run: |
          APK=build/NeonBus-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" > build/apk_files.txt   # list to a file: avoids SIGPIPE under pipefail
          grep -qx "AndroidManifest.xml" build/apk_files.txt
          grep -qx "lib/arm64-v8a/libgodot_android.so" build/apk_files.txt
          grep -qx "lib/armeabi-v7a/libgodot_android.so" build/apk_files.txt
          grep -q "^assets/" build/apk_files.txt
          rm build/apk_files.txt
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt" dump badging "$APK" > build/badging.txt
          head -8 build/badging.txt
          grep -q "package: name='com.neonbus.game'" build/badging.txt
          rm build/badging.txt
          sha256sum "$APK" | tee build/NeonBus-debug.apk.sha256
          du -h "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonBus-debug-apk
          path: |
            build/NeonBus-debug.apk
            build/NeonBus-debug.apk.sha256
          if-no-files-found: error

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/NeonBus-debug.apk
            build/NeonBus-debug.apk.sha256
          generate_release_notes: true

      - name: Publish rolling "latest" release (main branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/NeonBus-debug.apk build/NeonBus-debug.apk.sha256 \
            --prerelease --target "$GITHUB_SHA" --title "Neon Bus - latest debug build" \
            --notes "Automated debug APK from commit $GITHUB_SHA. Enable 'Install unknown apps' on your phone to sideload."
