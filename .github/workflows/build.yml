name: NEONRUSH Godot Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "neonbus.zip"
      - ".github/workflows/build.yml"
      - "game/**"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Godot project if source folder is not published yet
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f game/project.godot ]; then
            test -f neonbus.zip || { echo "::error::neonbus.zip not found"; exit 1; }
            mkdir -p game
            unzip -oq neonbus.zip -d game
          fi
          test -f game/project.godot || { echo "::error::project.godot missing after extraction"; exit 1; }
          echo "Project files:"
          find game -maxdepth 2 -type f | sort | head -n 100

      - name: Publish extracted source files to the repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/
          if ! git diff --cached --quiet; then
            git commit -m "Publish NEONRUSH Godot source files [skip ci]"
            git push origin HEAD:main
          else
            echo "Godot source files are already published."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Godot 4.3 and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Check project and import resources
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --headless --editor --path game --import --quit
          echo "Export presets:"
          if [ -f game/export_presets.cfg ]; then
            grep -E '^\\[preset\\.|^name=|^platform=' game/export_presets.cfg || true
          else
            echo "::error::export_presets.cfg is missing."
            exit 1
          fi

      - name: Validate project startup
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path game --quit-after 5 2>&1 | tee godot-smoke-test.log
          # The headless dummy renderer can emit harmless "mesh_get_surface_count" null-mesh
          # messages for 3D scenes. Fail only on script/parser/load errors, not renderer noise.
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call\\. Nonexistent function|Invalid set index|Attempt to call function' godot-smoke-test.log; then
            echo "::error::Godot reported a script or scene-load error during startup."
            exit 1
          fi

      - name: Export Android APK
        id: export
        shell: bash
        run: |
          set -euo pipefail
          PRESET="$(awk -F'"' '/^\\[preset\\./ { inside=1; next } /^\\[/ { inside=0 } inside && /^name=/ { print $2; exit }' game/export_presets.cfg)"
          if [ -z "$PRESET" ]; then
            echo "::error::No export preset name found in game/export_presets.cfg"
            exit 1
          fi
          if ! grep -q 'platform="Android"' game/export_presets.cfg; then
            echo "::error::No Android export preset exists in export_presets.cfg. Add an Android preset in Godot and commit it."
            exit 1
          fi
          mkdir -p release-apk
          echo "Using export preset: $PRESET"
          godot --headless --path game --export-debug "$PRESET" "$GITHUB_WORKSPACE/release-apk/NEONRUSH.apk"
          test -s release-apk/NEONRUSH.apk || { echo "::error::Godot did not produce an APK."; exit 1; }
          ls -lh release-apk/NEONRUSH.apk
          echo "apk_path=release-apk/NEONRUSH.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEONRUSH-Android-APK
          path: release-apk/NEONRUSH.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.1.{0}', github.run_number) }}
          name: NEONRUSH Android ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.1.{0}', github.run_number) }}
          body: |
            NEONRUSH Android build exported with Godot 4.3.
            This APK is for direct installation/testing. Test on a real Android device before wider distribution.
          files: release-apk/NEONRUSH.apk
          overwrite_files: true
          fail_on_unmatched_files: true
